test_suite_config:
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops.py
      unlisted_test_mode: skip
      tests:
        - names:
            # Parameterized lookup tests covering all dtype pair→op mappings
            - TestOps::test_to_dtype_op_map.*
            # Error messages must use torch dtype names, not internal SEN169/IEEE names
            - TestOps::test_dtype_op_table_error_message_uses_torch_names
            # Identity pairs must be symmetric: if (A,B) is identity so is (B,A)
            - TestOps::test_dtype_op_table_identity_pairs_symmetric
          mode: mandatory_success

  global:
    supported_dtypes:
      - name: float16
      - name: bfloat16
      - name: float32
      - name: bool
